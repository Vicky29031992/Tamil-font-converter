<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil Font Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(135deg, #f4f0fa 0%, #e8e0ff 100%);
      color: #2e1a47;
    }

    .page-wrapper {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      color: #4b0082;
      text-align: center;
      margin-bottom: 36px;
      font-size: 30px;
      letter-spacing: 0.3px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(75, 0, 130, 0.15);
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
      width: 100%;
      max-width: 680px;
    }

    .tile {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 18px;
      text-decoration: none;
      color: #4b0082;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      box-shadow:
        0 8px 24px rgba(75, 0, 130, 0.08),
        0 2px 6px rgba(75, 0, 130, 0.06);
      border: 1px solid rgba(199, 174, 243, 0.6);
      overflow: hidden;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(123, 71, 199, 0.06), rgba(167, 123, 238, 0.06));
      opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
    }

    .tile:hover {
      transform: translateY(-6px);
      box-shadow:
        0 14px 32px rgba(75, 0, 130, 0.14),
        0 4px 10px rgba(75, 0, 130, 0.08);
      background: #faf7ff;
    }

    .tile:hover::before {
      opacity: 1;
    }

    .tile-title {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 6px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .tile-desc {
      font-size: 13px;
      color: #5b3a8a;
      line-height: 1.35;
      text-align: center;
      max-width: 85%;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
        margin-bottom: 24px;
      }

      .tiles {
        gap: 16px;
        max-width: 100%;
      }

      .tile {
        min-height: 140px;
        padding: 22px 14px;
      }

      .tile-title {
        font-size: 16px;
      }

      .tile-desc {
        font-size: 12px;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <h1>Tamil Font Converter</h1>

    <div class="tiles">
      <a class="tile" href="converter.html" target="_blank">
        <div class="tile-title">Plain Text Tamil Font Converter</div>
        <div class="tile-desc">Convert between Bamini, Vanavil, Unicode and more</div>
      </a>

      <a class="tile" href="https://vicky29031992.pythonanywhere.com" target="_blank">
        <div class="tile-title">DOCX Tamil Font Converter</div>
        <div class="tile-desc">Convert Tamil fonts in Word documents</div>
      </a>
    </div>
  </div>
</body>
</html>
