  <!-- Mapping Scripts -->
  <script src="mappings/bamini_to_unicode.js"></script>
  <script src="mappings/vanavil_to_unicode.js"></script>
  <script src="mappings/sathayam_to_unicode.js"></script>
  <script src="mappings/anankuhelv_to_unicode.js"></script>

  <script>
    const fonts = [
      {
        id: "unicode",
        name: "Unicode",
        fontFile: "Tamil Sangam MN"
      },
      {
        id: "bamini",
        name: "Bamini",
        fontFile: "Bamini"
      },
      {
        id: "vanavil",
        name: "Vanavil",
        fontFile: "VANAVIL-Avvaiyar"
      },
      {
        id: "sathayam",
        name: "Sathayam",
        fontFile: "SATHAYAM"
      },
      {
        id: "anankuhelv",
        name: "Ananku Helv",
        fontFile: "Ananku Helv"
      }
    ];

    const baseMappings = {
      bamini:
        typeof bamini_to_unicode !== "undefined"
          ? bamini_to_unicode
          : null,

      vanavil:
        typeof vanavil_to_unicode !== "undefined"
          ? vanavil_to_unicode
          : null,

      sathayam:
        typeof sathayam_to_unicode !== "undefined"
          ? sathayam_to_unicode
          : null,

      anankuhelv:
        typeof anankuhelv_to_unicode !== "undefined"
          ? anankuhelv_to_unicode
          : null
    };

    let mappings = {};

    function generateFontStyles() {
      let styleContent = "";

      fonts.forEach((font) => {
        const fontName = font.fontFile + "Font";

        /*
         * The Unicode font is already declared in <head>.
         * Therefore, only legacy fonts are declared here.
         */
        if (font.id !== "unicode") {
          styleContent += `
            @font-face {
              font-family: "${fontName}";
              src:
                url("font/${font.fontFile}.ttf") format("truetype"),
                url("font/${font.fontFile}.woff") format("woff"),
                url("font/${font.fontFile}.woff2") format("woff2");
              font-weight: normal;
              font-style: normal;
              font-display: swap;
            }
          `;
        }

        if (font.id === "unicode") {
          styleContent += `
            .font-unicode {
              font-family:
                "ForcedTamilUnicode",
                "Tamil Sangam MN",
                "Arial Unicode MS",
                Arial,
                sans-serif !important;
            }
          `;
        } else {
          styleContent += `
            .font-${font.id} {
              font-family:
                "${fontName}",
                "ForcedTamilUnicode",
                "Arial Unicode MS",
                Arial,
                sans-serif !important;
            }
          `;
        }
      });

      const oldStyle = document.getElementById("dynamic-font-styles");

      if (oldStyle) {
        oldStyle.remove();
      }

      const styleTag = document.createElement("style");
      styleTag.id = "dynamic-font-styles";
      styleTag.textContent = styleContent;

      document.head.appendChild(styleTag);
    }

    function populateEncodingSelects() {
      const inputSelect = document.getElementById("input-encoding");
      const outputSelect = document.getElementById("output-encoding");

      inputSelect.innerHTML = "";
      outputSelect.innerHTML = "";

      fonts.forEach((font) => {
        const inputOption = document.createElement("option");
        inputOption.value = font.id;
        inputOption.textContent = font.name;
        inputSelect.appendChild(inputOption);

        const outputOption = document.createElement("option");
        outputOption.value = font.id;
        outputOption.textContent = font.name;
        outputSelect.appendChild(outputOption);
      });
    }

    function flipMapping(mapping) {
      const flipped = {};

      if (!mapping) {
        return flipped;
      }

      for (const [key, value] of Object.entries(mapping)) {
        if (!Object.prototype.hasOwnProperty.call(flipped, value)) {
          flipped[value] = key;
        }
      }

      return flipped;
    }

    function chainMapping(map1, map2) {
      const chained = {};

      if (!map1 || !map2) {
        return chained;
      }

      for (const [key, value] of Object.entries(map1)) {
        if (Object.prototype.hasOwnProperty.call(map2, value)) {
          chained[key] = map2[value];
        }
      }

      return chained;
    }

    function createPattern(mapping) {
      const keys = Object.keys(mapping).sort(
        (a, b) => b.length - a.length
      );

      if (keys.length === 0) {
        return null;
      }

      const escapedKeys = keys.map((key) =>
        key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
      );

      return new RegExp(escapedKeys.join("|"), "g");
    }

    function buildAllMappings() {
      mappings = {};

      const available = {};

      Object.keys(baseMappings).forEach((id) => {
        if (baseMappings[id]) {
          available[id] = baseMappings[id];
        }
      });

      const ids = Object.keys(available);

      ids.forEach((from) => {
        mappings[`${from}_to_unicode`] = available[from];
        mappings[`unicode_to_${from}`] =
          flipMapping(available[from]);
      });

      for (let i = 0; i < ids.length; i++) {
        for (let j = 0; j < ids.length; j++) {
          if (i === j) {
            continue;
          }

          const from = ids[i];
          const to = ids[j];

          mappings[`${from}_to_${to}`] = chainMapping(
            available[from],
            flipMapping(available[to])
          );
        }
      }

      console.log(
        "Mappings loaded:",
        Object.keys(mappings).length
      );
    }

    function doFontConversion() {
      const inputText =
        document.getElementById("input-text").value;

      const inputEncoding =
        document.getElementById("input-encoding").value;

      const outputEncoding =
        document.getElementById("output-encoding").value;

      const outputText =
        document.getElementById("output-text");

      if (inputEncoding === outputEncoding) {
        outputText.value = inputText;
        return;
      }

      const mapping =
        mappings[`${inputEncoding}_to_${outputEncoding}`];

      if (!mapping || Object.keys(mapping).length === 0) {
        outputText.value = inputText;
        return;
      }

      const pattern = createPattern(mapping);

      if (!pattern) {
        outputText.value = inputText;
        return;
      }

      outputText.value = inputText.replace(
        pattern,
        (match) => mapping[match] || match
      );
    }

    function updateInputFont() {
      const encoding =
        document.getElementById("input-encoding").value;

      const textarea =
        document.getElementById("input-text");

      fonts.forEach((font) => {
        textarea.classList.remove(`font-${font.id}`);
      });

      textarea.classList.add(`font-${encoding}`);

      try {
        localStorage.setItem(
          "tamilConverter_inputEncoding",
          encoding
        );
      } catch (error) {}

      doFontConversion();
    }

    function updateOutputFont() {
      const encoding =
        document.getElementById("output-encoding").value;

      const textarea =
        document.getElementById("output-text");

      fonts.forEach((font) => {
        textarea.classList.remove(`font-${font.id}`);
      });

      textarea.classList.add(`font-${encoding}`);

      try {
        localStorage.setItem(
          "tamilConverter_outputEncoding",
          encoding
        );
      } catch (error) {}

      doFontConversion();
    }

    /*
     * Load only the Tamil Unicode font.
     * No legacy font is loaded here.
     */
    function preloadUnicodeTamilFont() {
      return document.fonts.load(
        '16px "ForcedTamilUnicode"',
        "தமிழ்"
      );
    }

    function copyConverted() {
      const outputBox =
        document.getElementById("output-text");

      outputBox.select();
      outputBox.setSelectionRange(
        0,
        outputBox.value.length
      );

      navigator.clipboard
        .writeText(outputBox.value)
        .then(() => {
          alert("Converted text copied!");
        })
        .catch(() => {
          document.execCommand("copy");
          alert("Converted text copied!");
        });
    }

    function clearInputText() {
      document.getElementById("input-text").value = "";
      document.getElementById("output-text").value = "";

      doFontConversion();
    }

    document
      .getElementById("input-text")
      .addEventListener("input", doFontConversion);

    document
      .getElementById("input-encoding")
      .addEventListener("change", updateInputFont);

    document
      .getElementById("output-encoding")
      .addEventListener("change", updateOutputFont);

    document
      .getElementById("font-size-input")
      .addEventListener("change", function () {
        document.getElementById("input-text").style.fontSize =
          this.value + "px";

        try {
          localStorage.setItem(
            "tamilConverter_inputFontSize",
            this.value
          );
        } catch (error) {}
      });

    document
      .getElementById("font-size-output")
      .addEventListener("change", function () {
        document.getElementById("output-text").style.fontSize =
          this.value + "px";

        try {
          localStorage.setItem(
            "tamilConverter_outputFontSize",
            this.value
          );
        } catch (error) {}
      });

    window.addEventListener("load", async function () {
      window.scrollTo(0, 0);

      generateFontStyles();
      populateEncodingSelects();

      const savedInputFontSize =
        localStorage.getItem(
          "tamilConverter_inputFontSize"
        ) || "16";

      const savedOutputFontSize =
        localStorage.getItem(
          "tamilConverter_outputFontSize"
        ) || "16";

      const savedInputEncoding =
        localStorage.getItem(
          "tamilConverter_inputEncoding"
        ) || "unicode";

      const savedOutputEncoding =
        localStorage.getItem(
          "tamilConverter_outputEncoding"
        ) || "bamini";

      document.getElementById(
        "font-size-input"
      ).value = savedInputFontSize;

      document.getElementById(
        "font-size-output"
      ).value = savedOutputFontSize;

      document.getElementById(
        "input-text"
      ).style.fontSize = `${savedInputFontSize}px`;

      document.getElementById(
        "output-text"
      ).style.fontSize = `${savedOutputFontSize}px`;

      document.getElementById(
        "input-encoding"
      ).value = savedInputEncoding;

      document.getElementById(
        "output-encoding"
      ).value = savedOutputEncoding;

      buildAllMappings();

      updateInputFont();
      updateOutputFont();

      /*
       * Warm up only the Tamil Unicode font.
       * This prevents the first Unicode Tamil text
       * from waiting for the font download.
       */
      await preloadUnicodeTamilFont();

      doFontConversion();
    });
  </script>
